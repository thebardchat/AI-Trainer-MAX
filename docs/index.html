<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI-Trainer-MAX · Local AI literacy for every person</title>
  <link rel="stylesheet" href="colors_and_type.css">
  <link rel="stylesheet" href="site.css?v=5">
</head>
<body>
  <!-- Fixed page background: navy void + perspective grid + circuit
       traces + binary rain. Populated by JS below. -->
  <div class="page-bg" aria-hidden="true">
    <div class="grid"></div>
    <div class="traces">
      <svg viewBox="0 0 1600 900" preserveAspectRatio="none">
        <defs><filter id="pbg-glow"><feGaussianBlur stdDeviation="1.5"/></filter></defs>
        <g fill="none" stroke-width="1.5" filter="url(#pbg-glow)">
          <path d="M-50 240 L 300 240 Q 340 240 360 220 L 520 100 Q 540 85 580 85 L 900 85 Q 940 85 960 110 L 1120 280 Q 1140 300 1180 300 L 1650 300" stroke="#ff4a5c" opacity=".85"/>
          <path d="M-50 520 L 420 520 Q 460 520 480 500 L 620 380 Q 640 365 680 365 L 1650 365" stroke="#5bd0ff" opacity=".8"/>
          <path d="M-50 700 L 260 700 Q 300 700 320 680 L 460 560 Q 480 545 520 545 L 1100 545 Q 1140 545 1160 565 L 1280 690 Q 1300 710 1340 710 L 1650 710" stroke="#3aa8ff" opacity=".55"/>
          <path d="M880 620 L 1040 620 L 1080 660 L 1240 660" stroke="#ff4a5c" opacity=".6"/>
          <path d="M120 160 L 200 160 L 240 200 L 340 200" stroke="#ff4a5c" opacity=".55"/>
        </g>
        <g fill="#5bd0ff"><circle cx="360" cy="220" r="2.5"/><circle cx="580" cy="85" r="2.5"/><circle cx="960" cy="110" r="2.5"/><circle cx="1180" cy="300" r="2.5"/><circle cx="480" cy="500" r="2.5"/><circle cx="680" cy="365" r="2.5"/></g>
        <g fill="#ff4a5c"><circle cx="1040" cy="620" r="2.5"/><circle cx="240" cy="200" r="2.5"/></g>
      </svg>
    </div>
    <div class="rain" id="page-bg-rain"></div>
    <div class="vignette"></div>
  </div>

  <script>
    // Procedurally populate the binary-rain columns so every column
    // has its own phase/speed/palette — prevents visible looping.
    (function(){
      const rain = document.getElementById('page-bg-rain');
      if(!rain) return;
      const COLS = Math.ceil(window.innerWidth / 28);
      const rnd = (a,b) => a + Math.random()*(b-a);
      const bits = () => Array.from({length:48}, () => Math.random()<.5?'0':'1').join('\n');
      for(let i=0;i<COLS;i++){
        const el = document.createElement('div');
        const red = Math.random() < .18;
        const flick = Math.random() < .35;
        el.className = 'col ' + (red?'rd':'cy') + (flick?' flick':'');
        el.style.left = (i*28 + rnd(-6,6)) + 'px';
        el.style.animationDuration = rnd(7,18) + 's';
        el.style.animationDelay    = (-rnd(0,18)) + 's';
        el.style.opacity  = rnd(.35,.95);
        el.style.fontSize = rnd(11,15) + 'px';
        el.textContent = bits();
        rain.appendChild(el);
      }
    })();
  </script>

  <div id="app"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components/Nav.jsx"></script>
  <script type="text/babel" src="components/Hero.jsx"></script>
  <script type="text/babel" src="components/StatsBar.jsx"></script>
  <script type="text/babel" src="components/PhaseCards.jsx"></script>
  <script type="text/babel" src="components/Terminal.jsx"></script>
  <script type="text/babel" src="components/StackGrid.jsx"></script>
  <script type="text/babel" src="components/HardwareTiers.jsx"></script>
  <script type="text/babel" src="components/EcosystemChain.jsx"></script>
  <script type="text/babel" src="components/VideoReel.jsx"></script>
  <script type="text/babel" src="components/OblivionCallout.jsx"></script>
  <script type="text/babel" src="components/Footer.jsx"></script>

  <script type="text/babel">
    const App = () => (
      <>
        <Nav />
        <main>
          <Hero />
          <StatsBar />
          <PhaseCards />
          <Terminal />
          <StackGrid />
          <HardwareTiers />
          <EcosystemChain />
          <VideoReel />
          <OblivionCallout />
        </main>
        <Footer />
      </>
    );
    const root = ReactDOM.createRoot(document.getElementById("app"));
    // wait a tick so all babel scripts register their window globals
    setTimeout(() => root.render(<App />), 50);
  </script>
</body>
</html>
